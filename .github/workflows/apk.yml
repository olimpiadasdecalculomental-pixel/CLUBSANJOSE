name: Compilar CLUBSANJOSE.apk Oficial (Con Escudo 1942 y 5 Tablas)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  compilar-apk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Descargar Codigo
        uses: actions/checkout@v4

      - name: 2. Instalar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 3. Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: 4. Instalar Librerias Expo 54
        run: npm install --legacy-peer-deps

      - name: 5. Generar Proyecto Nativo Android con Logo Oficial
        run: npx expo prebuild --platform android --clean

      - name: 6. Compilar CLUBSANJOSE.apk
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../CLUBSANJOSE.apk

      - name: 7. Publicar CLUBSANJOSE.apk Lista para Descargar
        uses: actions/upload-artifact@v4
        with:
          name: CLUBSANJOSE-APK-OFICIAL
          path: CLUBSANJOSE.apk